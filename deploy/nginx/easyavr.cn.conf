# EasyAVR 生产站点配置（公网 IP 152.32.135.156，香港机房，无需备案）
#
# 用法：
#   ln -s /opt/easyavr/deploy/nginx/easyavr.cn.conf /etc/nginx/sites-enabled/easyavr.cn.conf
#   nginx -t && systemctl reload nginx
#
# 本文件被 include 在 nginx.conf 的 http 块内（sites-enabled 的默认位置），
# 因此文件顶层的 map 合法；不要把它 include 到某个 server 块里。
#
# 端口分工（全机只有一个进程能占用 80/443，就是 nginx）：
#   80/443  nginx：静态官网 + app 子域反代
#   8080    ZLMediaKit：只在 127.0.0.1 上监听，由本文件反代

# WebSocket 升级：没有 Upgrade 头时给 close，避免把普通 HTTP 请求标成 upgrade
# （直接写死 "upgrade" 会让 keep-alive 失效）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# 静态官网：easyavr.cn / www.easyavr.cn
# 站点根目录是仓库 site/ 目录的内容（纯 HTML/CSS/JS，零构建）
# ---------------------------------------------------------------------------

server {
    listen      80;
    listen      [::]:80;
    server_name easyavr.cn www.easyavr.cn;
    return 301 https://$host$request_uri;
}

server {
    # 宿主机禁用 IPv6 时删掉带 [::] 的两行，否则 nginx 启动会报
    # socket() [::]:443 failed (97: Address family not supported)
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name easyavr.cn www.easyavr.cn;

    # 证书由 certbot 签发，默认落在 /etc/letsencrypt/live/<主域>/ 下。
    # 三个域名（easyavr.cn / www / app）建议签在同一张证书里：
    #   certbot --nginx -d easyavr.cn -d www.easyavr.cn -d app.easyavr.cn
    # 这样 app.easyavr.cn 的 server 块可以直接复用同一组路径。
    # 不配置 OCSP 装订（ssl_stapling），也不配置 ESNI：前者会因网络不通拖慢握手，
    # 后者已从主流 OpenSSL 移除，加了只会让 nginx -t 报错。
    ssl_certificate     /etc/letsencrypt/live/easyavr.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easyavr.cn/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    root  /opt/easyavr/site;
    index index.html;

    # 安全响应头。CSP 暂不开启：站点 index.html 里有内联 style 和少量内联
    # script，直接上 default-src 'self' 会白屏；要么先把内联部分抽成外部文件，
    # 要么用 nonce/hash 方案，之后再评估。
    # 注意：nginx 的 add_header 不向子 location 继承——子 location 一旦自己
    # 写了 add_header，这里的三条就要在那边重新声明一遍。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # HTML 不缓存；/assets/ 下的静态资源在下面的 location 里单独覆盖。
    add_header Cache-Control "no-cache" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    # text/html 默认就压缩，写进 gzip_types 只会让 nginx -t 报 duplicate MIME type
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # 官网资源文件名固定、内容不变，可以长缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header 不继承，父级的安全头必须重复声明
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # 站内只有 index.html，没有自定义 404 页面，不要引用不存在的文件
    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------------------------------------------------------------------------
# 平台前端：app.easyavr.cn
# 后端自己托管 web/dist 并做 SPA fallback，所以 / 直接反代 18000
# ---------------------------------------------------------------------------

server {
    listen      80;
    listen      [::]:80;
    server_name app.easyavr.cn;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name app.easyavr.cn;

    # 与静态站同一张证书（含 app 子域 SAN）
    ssl_certificate     /etc/letsencrypt/live/easyavr.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easyavr.cn/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # 图片、抓拍图、录像文件上传
    client_max_body_size 200m;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 后端 API + 内嵌的 web/dist
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket（后端有实时推送/长连接）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # 媒体路径反代到 ZLMediaKit。
    # 8080 是 ZLM 在宿主机回环上的 HTTP 端口（容器内仍然是 80），
    # 见仓库根目录的 docker-compose.prod.yml；ZLM 不得直接绑定宿主机 80。
    # 后端用 EASYAVR_MEDIA_HOST=app.easyavr.cn + EASYAVR_MEDIA_SCHEME=https
    # + EASYAVR_ZLM_HTTP_PORT=443 拼出 https://app.easyavr.cn/live/... 这类地址，
    # 这三类前缀必须能落到 ZLM 上，否则播放地址 404。
    location ^~ /live/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 拉流是长连接，且不能缓冲（缓冲会让 HLS/FLV 延迟变大、首帧变慢）
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;

        # 播放列表每次都要回源校验；分片（.ts/.mp4）走上面的默认策略
        # 注：^~ 前缀匹配会跳过 server 级正则，所以这里用嵌套 location。
        location ~ \.m3u8$ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
            add_header Cache-Control "no-cache" always;
            # 子 location 自己加了 add_header，父级安全头需重复声明
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
        }
    }

    # 录像回放：ZLM 的 /record/<streamKey>/<date>/<file>
    location ^~ /record/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebRTC 信令：后端拼的是 /index/api/webrtc?app=..&stream=..&type=play
    location ^~ /index/api/webrtc {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
