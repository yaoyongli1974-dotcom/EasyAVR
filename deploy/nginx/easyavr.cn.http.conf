# 临时 HTTP 版（curl/内网自测 + 域名实名通过前）。
#
# 为什么存在：easyavr.cn 处于 clientHold/pendingVerification，没有可用证书，
# 443 起不来。这份只开 80，用来验证站点内容与反代链路；正式切 HTTPS 用它：
#   deploy/nginx/easyavr.cn.conf（80→301 + 443 + 证书）
#
# 适配 1Panel/openresty（152.32.135.156 实机）：
#   配置文件 → /opt/1panel/www/conf.d/easyavr.cn.conf
#   静态站   → /opt/1panel/www/sites/easyavr.cn/index（容器里是 /www/sites/...）
# 注意 1Panel 的 conf.d 实际挂载点是 /opt/1panel/www/conf.d，
# /opt/1panel/apps/openresty/openresty/conf/conf.d 是个陈旧副本目录，改了不生效。
# 不要加 listen ... default_server：同机其他站点与 00.default.conf 仍要占默认位。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# 官网静态站
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name easyavr.cn www.easyavr.cn;

    root /www/sites/easyavr.cn/index;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 证书签发时就近放一个 ACME 目录，省得再改配置
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/easyavr.cn/index;
        allow all;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}

# ---------------------------------------------------------------------------
# 平台（SPA + API + 媒体）
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name app.easyavr.cn;

    client_max_body_size 200m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 播放地址、HLS 切片、录制回放、WebRTC 信令都落到 ZLM（回环 8080）
    location ^~ /live/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /record/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /index/api/webrtc {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 平台本体：API、快照、静态资源、SPA fallback
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
